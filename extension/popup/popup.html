<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <title>Sharepane</title>
    <link rel="stylesheet" href="popup.css" />
  </head>
  <body>
    <header>
      <span class="title">Sharepane</span>
      <span id="status" class="status" data-state="connecting">checking…</span>
    </header>

    <div id="host-missing" class="notice notice--error" hidden>
      Sharepane's helper isn't installed yet. <a href="#" id="open-onboarding">Open the setup guide</a>. It's one
      command.
    </div>
    <div id="host-error" class="notice notice--error" hidden></div>
    <div id="host-restarting" class="notice" hidden>The Sharepane helper stopped unexpectedly. Restarting it…</div>

    <section class="current" aria-labelledby="current-title">
      <div class="page">
        <img id="current-favicon" class="favicon" alt="" />
        <div class="page-meta">
          <div id="current-title" class="page-title">This tab</div>
          <div id="current-host" class="page-host"></div>
        </div>
      </div>

      <label class="switch-row switch-row--primary">
        <span class="switch-label">Share with Claude</span>
        <input type="checkbox" role="switch" id="share-switch" />
      </label>
      <p id="share-hint" class="hint"></p>
    </section>

    <section class="capture" aria-labelledby="capture-heading">
      <h2 id="capture-heading">Claude can also see, on shared tabs</h2>
      <label class="switch-row">
        <span class="switch-label">Console logs</span>
        <input type="checkbox" role="switch" id="capture-console" />
      </label>
      <label class="switch-row">
        <span class="switch-label">Network requests</span>
        <input type="checkbox" role="switch" id="capture-network" />
      </label>
      <label class="switch-row">
        <span class="switch-label">
          Screenshots
          <span class="sub">Firefox requires access to all sites for this</span>
        </span>
        <input type="checkbox" role="switch" id="capture-screenshots" />
      </label>
    </section>

    <section id="others" class="others" aria-labelledby="others-heading" hidden>
      <h2 id="others-heading">Also shared</h2>
      <ul id="others-list"></ul>
    </section>

    <footer>
      <a href="#" id="open-options-footer">Settings</a>
      <a href="#" id="open-onboarding-footer">Setup guide</a>
    </footer>

    <script src="popup.js"></script>
  </body>
</html>

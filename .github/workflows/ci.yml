name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"

      - run: npm install

      - run: npm run typecheck

      - run: npm test

      - run: npm run lint:extension

      - run: npm run build

  release-artifacts:
    needs: test
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"

      - run: npm install
      - run: npm run build

      # web-ext sign requires AMO API credentials (AMO_JWT_ISSUER /
      # AMO_JWT_SECRET) as repo secrets — set these up once you're ready to
      # publish for real; see the README's Roadmap section.
      - name: Build unsigned extension artifact
        run: npx web-ext build --source-dir=extension --artifacts-dir=web-ext-artifacts

      - uses: actions/upload-artifact@v4
        with:
          name: tab-bridge-extension-unsigned
          path: web-ext-artifacts/*.zip

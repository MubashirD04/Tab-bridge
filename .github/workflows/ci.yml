name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"

      - run: npm ci

      - name: Extension, npm package and plugin share one version
        run: node scripts/version.mjs check

      - run: npm run typecheck

      - run: npm test

      - run: npm run lint:extension

      - run: npm run build

      # The Claude Code plugin ships the bundled CLI in git (plugins install
      # straight from the repo, with no build step), so it must match what
      # the source builds to.
      - name: Plugin bundle is up to date
        run: |
          if ! git diff --exit-code --stat -- plugins/sharepane/bin; then
            echo "::error::plugins/sharepane/bin/sharepane.mjs is out of date. Run 'npm run build' and commit it."
            exit 1
          fi

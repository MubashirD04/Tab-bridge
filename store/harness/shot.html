<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=1280" />
    <title>Sharepane store screenshot</title>
    <style>
      /* One 1280×800 store screenshot: a headline, then the real extension
         page (iframe, rendered with mock-browser.js) in a plain browser
         window. The checkout page is a made-up example app. */
      * { box-sizing: border-box; }
      html, body { margin: 0; width: 1280px; height: 800px; overflow: hidden; }
      body {
        font: 15px/1.45 -apple-system, "Segoe UI", Roboto, sans-serif;
        color: #1f2328;
        background: linear-gradient(160deg, #e9f1ff 0%, #f6f8fb 55%, #eef2f7 100%);
        position: relative;
      }
      .headline { position: absolute; left: 72px; top: 52px; width: 1136px; }
      .headline h1 { margin: 0 0 8px; font-size: 38px; line-height: 1.15; letter-spacing: -0.02em; font-weight: 700; }
      .headline p { margin: 0; font-size: 19px; color: #57606a; max-width: 900px; }
      .mark { display: inline-flex; align-items: center; gap: 8px; font-weight: 600; color: #1f6feb; font-size: 15px; margin-bottom: 14px; }
      .mark img { width: 22px; height: 22px; }

      .window {
        position: absolute; left: 72px; right: 72px; top: 214px; bottom: -24px;
        background: #fff; border-radius: 12px; overflow: hidden;
        box-shadow: 0 24px 60px rgba(15, 33, 70, 0.18), 0 0 0 1px rgba(15, 33, 70, 0.08);
      }
      .tabstrip { height: 38px; background: #eef0f3; display: flex; align-items: flex-end; padding: 0 12px; gap: 6px; }
      .dots { display: flex; gap: 7px; align-self: center; margin-right: 12px; }
      .dots i { width: 11px; height: 11px; border-radius: 50%; background: #d0d4da; display: block; }
      .tab { height: 30px; padding: 0 14px; display: flex; align-items: center; gap: 8px; font-size: 12.5px; color: #57606a; border-radius: 8px 8px 0 0; max-width: 230px; white-space: nowrap; overflow: hidden; }
      .tab.active { background: #fff; color: #1f2328; }
      .tab img { width: 14px; height: 14px; }
      .toolbar { height: 44px; display: flex; align-items: center; gap: 10px; padding: 0 14px; border-bottom: 1px solid #e6e8eb; }
      .url { flex: 1; height: 30px; border-radius: 8px; background: #f1f3f5; display: flex; align-items: center; padding: 0 12px; font-size: 13px; color: #3d444d; }
      .url b { color: #1f2328; font-weight: 500; }
      .ext { position: relative; width: 30px; height: 30px; border-radius: 7px; display: grid; place-items: center; }
      .ext.open { background: #e2e6eb; }
      .ext img { width: 18px; height: 18px; }
      .badge { position: absolute; right: -3px; bottom: 0; background: #2ea043; color: #fff; font: 700 8px/1 sans-serif; padding: 2px 3px; border-radius: 3px; }
      .viewport { position: absolute; top: 82px; left: 0; right: 0; bottom: 0; }
      /* Pages shown at 80% so more of them fits, like zooming out in Firefox. */
      .viewport iframe.page { width: 125%; height: 125%; border: 0; transform: scale(0.8); transform-origin: 0 0; }

      .popup {
        position: absolute; top: 76px; right: 6px; width: 340px; border: 0; background: #fff;
        border-radius: 10px; box-shadow: 0 12px 34px rgba(15, 33, 70, 0.25), 0 0 0 1px rgba(15, 33, 70, 0.1);
      }

      /* The made-up app behind the popup. */
      .app { font: 14px/1.5 -apple-system, "Segoe UI", Roboto, sans-serif; color: #212529; height: 100%; background: #fafaf9; }
      .app header { height: 56px; display: flex; align-items: center; padding: 0 32px; gap: 28px; background: #fff; border-bottom: 1px solid #ece9e4; }
      .app .logo { font-weight: 800; color: #e8590c; font-size: 18px; }
      .app nav { color: #6b6560; display: flex; gap: 22px; font-size: 14px; }
      .app main { padding: 28px 32px; display: grid; grid-template-columns: 1fr 340px; gap: 28px; width: 760px; }
      .app h2 { margin: 0 0 16px; font-size: 22px; }
      .app .card { background: #fff; border: 1px solid #ece9e4; border-radius: 10px; padding: 18px; }
      .app .field { height: 38px; border: 1px solid #dcd8d2; border-radius: 7px; margin-bottom: 12px; padding: 9px 12px; color: #9a948d; }
      .app .error { background: #fff1f0; border: 1px solid #ffc9c4; color: #b42318; border-radius: 8px; padding: 10px 12px; margin-bottom: 16px; font-size: 13.5px; }
      .app button { width: 100%; height: 42px; border: 0; border-radius: 8px; background: #e8590c; color: #fff; font-weight: 600; font-size: 15px; opacity: 0.55; }
      .app .row { display: flex; justify-content: space-between; margin-bottom: 8px; font-size: 13.5px; }
    </style>
  </head>
  <body>
    <div class="headline">
      <div class="mark"><img src="/extension/icons/icon.svg" alt="" />Sharepane</div>
      <h1 id="title"></h1>
      <p id="subtitle"></p>
    </div>

    <div class="window">
      <div class="tabstrip">
        <div class="dots"><i></i><i></i><i></i></div>
        <div class="tab active" id="tab-active"></div>
        <div class="tab" id="tab-other"></div>
      </div>
      <div class="toolbar">
        <div class="url" id="url"></div>
        <div class="ext" id="ext"><img src="/extension/icons/icon.svg" alt="" /></div>
      </div>
      <div class="viewport" id="viewport"></div>
    </div>

    <template id="checkout-app">
      <div class="app">
        <header><span class="logo">Acme Outfitters</span><nav><span>Shop</span><span>Orders</span><span>Account</span></nav></header>
        <main>
          <section>
            <h2>Checkout</h2>
            <div class="error">Payment failed: something went wrong. Please try again.</div>
            <div class="card">
              <div class="field">Card number</div>
              <div class="field">MM / YY</div>
              <div class="field">Name on card</div>
              <button>Pay $84.00</button>
            </div>
          </section>
          <aside class="card">
            <h2 style="font-size: 17px">Order summary</h2>
            <div class="row"><span>Trail jacket</span><span>$72.00</span></div>
            <div class="row"><span>Shipping</span><span>$12.00</span></div>
            <div class="row" style="font-weight: 700"><span>Total</span><span>$84.00</span></div>
          </aside>
        </main>
      </div>
    </template>

    <script>
      const SHOTS = {
        popup: {
          title: "Share the tab you're debugging",
          subtitle: "One switch lets Claude read this page, its console and its network requests.",
          tab: ["Checkout · Acme Outfitters", "A"],
          other: "Payments API reference",
          url: ["localhost:5173", "/checkout"],
          app: true,
          popup: "popup",
          badge: true,
        },
        "onboarding-start": {
          title: "Set up with one command",
          subtitle: "A short checklist walks you through it, and each step turns green by itself once it's done.",
          tab: ["Set up Sharepane", "S"],
          url: ["moz-extension://", "…/onboarding/onboarding.html"],
          page: "onboarding/onboarding.html?scenario=onboarding-start",
        },
        onboarding: {
          title: "Works with Claude Code and Claude Desktop",
          subtitle: "The extension talks to a small helper on your computer. Claude reads only the tabs you share, read-only.",
          tab: ["Set up Sharepane", "S"],
          url: ["moz-extension://", "…/onboarding/onboarding.html"],
          page: "onboarding/onboarding.html?scenario=onboarding",
          badge: true,
        },
        settings: {
          title: "You decide what Claude can see",
          subtitle: "Console logs, network requests and screenshots each stay off until you turn them on.",
          tab: ["Sharepane — Settings", "S"],
          url: ["moz-extension://", "…/options/options.html"],
          page: "options/options.html?scenario=settings",
        },
      };

      const shot = SHOTS[new URLSearchParams(location.search).get("shot")] || SHOTS.popup;
      document.getElementById("title").textContent = shot.title;
      document.getElementById("subtitle").textContent = shot.subtitle;

      const tab = document.getElementById("tab-active");
      const fav = document.createElement("img");
      fav.src = shot.tab[1] === "S" ? "/extension/icons/icon.svg" : "data:image/svg+xml," + encodeURIComponent('<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 16 16"><rect width="16" height="16" rx="4" fill="#e8590c"/><text x="8" y="12" font-family="sans-serif" font-size="10" font-weight="700" fill="#fff" text-anchor="middle">A</text></svg>');
      tab.append(fav, shot.tab[0]);
      document.getElementById("tab-other").textContent = shot.other || "";
      document.getElementById("tab-other").hidden = !shot.other;

      const url = document.getElementById("url");
      const host = document.createElement("b");
      host.textContent = shot.url[0];
      url.append(host, shot.url[1]);

      const ext = document.getElementById("ext");
      if (shot.badge) {
        const b = document.createElement("span");
        b.className = "badge";
        b.textContent = "ON";
        ext.append(b);
      }

      const viewport = document.getElementById("viewport");
      if (shot.app) {
        viewport.append(document.getElementById("checkout-app").content.cloneNode(true));
      } else {
        const frame = document.createElement("iframe");
        frame.className = "page";
        frame.src = `/extension/${shot.page}`;
        viewport.append(frame);
      }

      if (shot.popup) {
        ext.classList.add("open");
        const popup = document.createElement("iframe");
        popup.className = "popup";
        popup.src = `/extension/popup/popup.html?scenario=${shot.popup}`;
        // Size the frame to the popup's own content, as Firefox does.
        popup.addEventListener("load", () => {
          const fit = () => (popup.style.height = popup.contentDocument.documentElement.scrollHeight + "px");
          fit();
          setTimeout(fit, 150);
        });
        document.querySelector(".window").append(popup);
      }
    </script>
  </body>
</html>
